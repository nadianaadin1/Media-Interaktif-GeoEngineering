  <button id="gemini-chat-toggle" onclick="toggleChat()">💬</button>

  <div id="gemini-chat-window">
    <div class="chat-header">
      <span>Tutor Pendamping LKPD</span>
      <button class="chat-close-btn" onclick="toggleChat()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg tutor">Halo! Ada materi atau soal LKPD di website ini yang ingin kamu tanyakan?</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Tanyakan petunjuk..." onkeypress="if(event.key === 'Enter') sendMsg()">
      <button onclick="sendMsg()">Kirim</button>
    </div>
  </div>

  <script>
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const output = document.getElementById('output');
async function askGemini(promptText) {
      try {
        output.innerText = "Sedang berpikir...";

        const response = await fetch('/.netlify/functions/gemini', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText }),
        });

        const data = await response.json();

        if (data.reply) {
	output.innerText = data.reply;
        } else {
          output.innerText = "Terjadi kesalahan: " + data.error;
        }
      } catch (err) {
        output.innerText = "Gagal terhubung ke server.";
        console.error(err);
      }
    }
	sendBtn.addEventListener('click', () => {
      const text = userInput.value;
      if (text) {
        askGemini(text);
      }
    });
  </script>
